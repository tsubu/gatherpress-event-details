name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gatherpress-event-details

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: gatherpress-event-details

      - name: Check out GatherPress for PHPStan
        uses: actions/checkout@v7
        with:
          repository: GatherPress/gatherpress
          ref: 0.36.1
          path: gatherpress

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gatherpress-event-details/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build the block
        run: npm run build

      - name: Run PHP lint
        run: npm run lint:php

      - name: Run PHPStan
        run: npm run lint:phpstan

      - name: Run JavaScript lint
        run: npm run lint:js

      - name: Run CSS lint
        run: npm run lint:css

      - name: Run JavaScript unit tests
        run: npm run test:unit:js

      - name: Start the WordPress test environment
        run: npm run wp-env start

      - name: Run single-site PHP unit tests
        run: npm run test:unit:php

      - name: Run multisite PHP unit tests
        run: npm run wp-env -- run tests-cli --env-cwd=wp-content/plugins/gatherpress-event-details env WP_MULTISITE=1 vendor/bin/phpunit

      - name: Stop the WordPress test environment
        if: always()
        run: npm run wp-env stop
